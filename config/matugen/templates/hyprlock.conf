# Hyprlock Matugen Colors

# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/hyprlock/background.png
    blur_passes = 3
    blur_size= 3
    noise=0.0
    contrast = 0.8916
    brightness = 0.8172
}

# GENERAL
general {
    screencopy_mode = 0
}

animations {
    enabled = true
    bezier = fluid, 0.45, 0, 0.55, 1

    animation = fadeIn, 1, 6, fluid    
    animation = fadeOut, 1, 6, fluid
    animation = inputFieldDots, 1, 2, linear
    animation = inputFieldColors, 1, 8, fluid
    animation = inputFieldFade, 1, 8, fluid
    animation = inputFieldWidth, 1, 8, fluid
}

# Profie-Photo
image {
    monitor =
    path = ~/.config/hypr/hyprlock/user.jpg
    border_size = 2
    border_color = rgba(0, 0, 0, 0)
    size = 200
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 30
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    color = {{ colors.tertiary_container.default.rgba | set_alpha: 0.8 }}
    font_size = 25
    font_family = SF Pro Display Bold
    position = 0, 350
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M"
    color = {{ colors.primary_container.default.rgba | set_alpha: 0.8 }}
    font_size = 80
    font_family = SF Pro Display Bold
    position = 0, 260
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = {{ colors.tertiary_container.default.rgba | set_alpha: 0.8 }}
    font_size = 22
    font_family = SF Pro Display Bold
    position = 0, -100
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 350, 60
    fade_on_empty = true
    fade_timeout = 500
    font_family = SF Pro Display Bold
    font_color = {{ colors.primary_container.default.rgba | set_alpha: 0.8 }}
    outline_thickness = 2 
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    check_color = {{ colors.primary.default.rgba | set_alpha: 0.8 }}
    fail_color = {{ colors.error.default.rgba | set_alpha: 0.8 }}
    inner_color = {{ colors.primary_container.default.rgba | set_alpha: 0.4 }}
    placeholder_text = <span foreground="#{{ colors.tertiary_container.default.hex }}"> Enter password</span>
    hide_input = false
    capslock_color = {{ colors.error.default.rgba | set_alpha: 0.8 }}
    numlock_color = {{ colors.error.default.rgba | set_alpha: 0.8 }}
    position = 0, -180
    halign = center
    valign = center
}

##############################
## Now Playing ###############
##############################

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/hyprlock/nowplaying/nowplaying.sh
    color = {{ colors.tertiary_container.default.rgba | set_alpha: 0.8 }}
    font_size = 12
    font_family = SF Pro Display
    position = 10, 20
    halign = left
    valign = bottom
}

image {
    monitor =
    path = /tmp/nowplaying/hypr/album_art.webp
    onclick = ~/.config/hypr/hyprlock/nowplaying/nowplaying.sh --toggle-pause
    border_size = 2
    border_color = rgba(0, 0, 0, 0)
    size = 150
    rounding = 14
    rotate = 0
    reload_time = 1
    reload_cmd = 
    position = 10, 120
    halign = left
    valign = bottom
}

# PREVIOUS SONG
label {
    monitor =
    text = cmd[update:0:true] ~/.config/hypr/hyprlock/nowplaying/nowplaying.sh --get-previous-btn
    color = {{ colors.tertiary_container.default.rgba | set_alpha: 0.8 }}
    font_size = 18
    position = 40, 90
    halign = left
    valign = bottom
    onclick = ~/.config/hypr/hyprlock/nowplaying/nowplaying.sh --previous
}

# PLAY/PAUSE TOGGLE
label {
    monitor =
    text = cmd[update:0:true] ~/.config/hypr/hyprlock/nowplaying/nowplaying.sh --get-toggle-btn
    color = {{ colors.tertiary_container.default.rgba | set_alpha: 0.8 }}
    font_size = 18
    position = 80, 90
    halign = left
    valign = bottom
    onclick = ~/.config/hypr/hyprlock/nowplaying/nowplaying.sh --toggle-pause
}

# NEXT SONG
label {
    monitor =
    text = cmd[update:0:true] ~/.config/hypr/hyprlock/nowplaying/nowplaying.sh --get-next-btn
    color = {{ colors.tertiary_container.default.rgba | set_alpha: 0.8 }}
    font_size = 18
    position = 120, 90
    halign = left
    valign = bottom
    onclick = ~/.config/hypr/hyprlock/nowplaying/nowplaying.sh --next
}

################################
### System power button ########
################################

# SHUTDOWN
label {
    monitor =
    text = <span>    </span>
    color = {{ colors.tertiary_container.default.rgba | set_alpha: 0.8 }}
    font_size = 22
    position = -10, 20
    halign = right
    valign = bottom
    onclick = ~/.config/hypr/hyprlock/action.sh --shutdown
}

# REBOOT
label {
    monitor =
    text = <span>    </span>
    color = {{ colors.tertiary_container.default.rgba | set_alpha: 0.8 }}
    font_size = 22
    position = -60, 20
    halign = right
    valign = bottom
    onclick = ~/.config/hypr/hyprlock/action.sh --reboot
}

# SLEEP
label {
    monitor =
    text = <span>    </span>
    color = {{ colors.tertiary_container.default.rgba | set_alpha: 0.8 }}
    font_size = 22
    position = -100, 24
    halign = right
    valign = bottom
    onclick = ~/.config/hypr/hyprlock/action.sh --sleep
}

# CONFIRMATION MESSAGE
