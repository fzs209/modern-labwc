[colors-dark]
alpha=1

background={{ colors.background.default.hex_stripped }}
foreground={{ colors.on_surface.default.hex_stripped }}

# Better cursor contrast
cursor={{ colors.background.default.hex_stripped }} {{ colors.primary.default.hex_stripped }}

selection-foreground={{ colors.on_primary.default.hex_stripped }}
selection-background={{ colors.primary.default.hex_stripped }}

# REGULAR COLORS 
regular0={{ colors.surface_variant.default.hex_stripped }}          # black
regular1={{ colors.error.default.hex_stripped }}                    # red
regular2={{ colors.primary.default.hex_stripped }}                  # green
regular3={{ colors.tertiary.default.hex_stripped }}                 # yellow
regular4={{ colors.secondary.default.hex_stripped }}                # blue
regular5={{ colors.primary_container.default.hex_stripped }}        # magenta
regular6={{ colors.secondary_container.default.hex_stripped }}      # cyan
regular7={{ colors.on_surface.default.hex_stripped }}               # white

# BRIGHT COLORS 
bright0={{ colors.surface_bright.default.hex_stripped }}
bright1={{ colors.error_container.default.hex_stripped }}
bright2={{ colors.primary_container.default.hex_stripped }}
bright3={{ colors.tertiary_container.default.hex_stripped }}
bright4={{ colors.secondary_container.default.hex_stripped }}
bright5={{ colors.primary.default.hex_stripped }}
bright6={{ colors.secondary.default.hex_stripped }}
bright7={{ colors.on_surface_variant.default.hex_stripped }}